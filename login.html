<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="theme-color" content="#004ac6"/>
<meta name="description" content="FreeZone BD — Login or create your account."/>
<title>Login - FreeZone BD</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "primary": "#004ac6", "primary-container": "#2563eb", "primary-fixed": "#dbe1ff",
          "background": "#f7f9fb", "on-surface": "#191c1e", "on-surface-variant": "#434655",
          "surface-container": "#eceef0", "surface-container-low": "#f2f4f6",
          "slate-surface": "#ffffff", "slate-border": "#e2e8f0", "slate-muted": "#64748b", "slate-subtle": "#94a3b8",
          "error": "#ba1a1a", "error-container": "#ffdad6", "on-error-container": "#93000a",
          "online-emerald": "#10b981"
        },
        fontFamily: { sans: ["Inter", "Hind Siliguri", "system-ui", "sans-serif"] }
      }
    }
  }
</script>
<style type="text/tailwindcss">
  @layer components {
    .field {
      @apply w-full bg-surface-container-low border border-transparent rounded-xl py-3 pl-11 pr-3 text-[16px] text-on-surface placeholder:text-slate-subtle outline-none transition-colors;
    }
    .field:focus { @apply border-primary-container bg-white ring-2 ring-primary-container/15; }
    .field[aria-invalid="true"] { @apply border-error bg-white ring-2 ring-error/10; }
    .field-icon { @apply absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-muted pointer-events-none; }
    .label { @apply block text-[13px] font-semibold text-on-surface mb-1.5; }
    .btn-primary {
      @apply w-full py-3 rounded-xl bg-primary-container text-white font-semibold text-[15px] shadow-md shadow-primary-container/25
             flex items-center justify-center gap-2 active:scale-[.98] transition-all disabled:opacity-60 disabled:pointer-events-none;
    }
    .link { @apply text-primary font-semibold hover:underline; }
  }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1;
    display: inline-block; text-transform: none; letter-spacing: normal; white-space: nowrap; direction: ltr;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .rise { animation: rise .4s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
</head>

<body class="font-sans text-on-surface antialiased bg-background selection:bg-primary-fixed"
      style="background-image: radial-gradient(ellipse 80% 50% at 50% -10%, #dbe1ff 0%, transparent 70%);">

<!-- Shown while Firebase checks whether the user is already logged in -->
<div id="boot" class="min-h-[100dvh] flex items-center justify-center">
  <div class="w-9 h-9 rounded-full border-[3px] border-primary-fixed border-t-primary-container animate-spin"></div>
</div>

<main id="page" class="min-h-[100dvh] flex items-center justify-center px-4 py-8" hidden>
  <div class="w-full max-w-md rise">

    <!-- Brand -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-primary-container text-white flex items-center justify-center shadow-lg shadow-primary-container/30">
        <span class="material-symbols-outlined text-[30px]" style="font-variation-settings:'FILL' 1;">forum</span>
      </div>
      <h1 class="text-[28px] leading-8 font-extrabold text-primary tracking-tight">FreeZone BD</h1>
      <p class="text-[13px] text-slate-muted font-medium mt-0.5">Connect. Share. Chat.</p>
    </div>

    <div class="bg-slate-surface border border-slate-border rounded-3xl shadow-xl shadow-slate-900/5 p-5 sm:p-7">

      <!-- Tabs -->
      <div id="tabs" role="tablist" class="flex gap-1 p-1 bg-surface-container rounded-xl mb-5">
        <button type="button" role="tab" id="tabLogin" data-view="login" class="flex-1 py-2.5 rounded-lg text-[14px] font-semibold transition-all">Login</button>
        <button type="button" role="tab" id="tabSignup" data-view="signup" class="flex-1 py-2.5 rounded-lg text-[14px] font-semibold transition-all">Sign up</button>
      </div>

      <!-- Message box -->
      <div id="alert" role="alert" aria-live="polite" class="mb-4 rounded-xl px-3.5 py-3 flex items-start gap-2.5 text-[14px]" hidden>
        <span id="alertIcon" class="material-symbols-outlined text-[20px] mt-0.5"></span>
        <div class="min-w-0">
          <p id="alertBn" class="font-semibold leading-snug"></p>
          <p id="alertEn" class="text-[12.5px] opacity-80 leading-snug mt-0.5"></p>
        </div>
      </div>

      <!-- LOGIN -->
      <form id="loginForm" class="space-y-4" novalidate>
        <div>
          <label class="label" for="loginEmail">Email</label>
          <div class="relative">
            <span class="material-symbols-outlined field-icon">mail</span>
            <input id="loginEmail" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" class="field" required />
          </div>
        </div>

        <div>
          <label class="label" for="loginPassword">Password</label>
          <div class="relative">
            <span class="material-symbols-outlined field-icon">lock</span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Your password" class="field pr-11" required />
            <button type="button" data-toggle-password class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full flex items-center justify-center text-slate-muted hover:bg-surface-container" aria-label="Show password" aria-pressed="false">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between gap-3">
          <label class="flex items-center gap-2 text-[14px] text-on-surface-variant cursor-pointer select-none">
            <input id="rememberMe" type="checkbox" checked class="w-4 h-4 rounded border-slate-border text-primary-container focus:ring-primary-container/30" />
            Remember me
          </label>
          <button type="button" id="forgotBtn" class="text-[14px] link">Forgot password?</button>
        </div>

        <button type="submit" id="loginBtn" class="btn-primary">Login</button>

        <p class="text-center text-[14px] text-slate-muted">
          New here? <button type="button" data-view="signup" class="link">Create an account</button>
        </p>
      </form>

      <!-- SIGN UP -->
      <form id="signupForm" class="space-y-4" novalidate hidden>
        <div>
          <label class="label" for="signupName">Full name</label>
          <div class="relative">
            <span class="material-symbols-outlined field-icon">person</span>
            <input id="signupName" name="name" type="text" autocomplete="name" maxlength="40" placeholder="Your name" class="field" required />
          </div>
        </div>

        <div>
          <label class="label" for="signupUsername">Username</label>
          <div class="relative">
            <span class="material-symbols-outlined field-icon">alternate_email</span>
            <input id="signupUsername" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" placeholder="username" class="field" required />
          </div>
          <p id="usernameHint" class="text-[12.5px] text-slate-subtle mt-1">3–20 characters: small letters, numbers, _ and .</p>
        </div>

        <div>
          <label class="label" for="signupEmail">Email</label>
          <div class="relative">
            <span class="material-symbols-outlined field-icon">mail</span>
            <input id="signupEmail" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" class="field" required />
          </div>
        </div>

        <div>
          <label class="label" for="signupPassword">Password</label>
          <div class="relative">
            <span class="material-symbols-outlined field-icon">lock</span>
            <input id="signupPassword" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" class="field pr-11" required />
            <button type="button" data-toggle-password class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full flex items-center justify-center text-slate-muted hover:bg-surface-container" aria-label="Show password" aria-pressed="false">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
          <div class="flex gap-1 mt-2" aria-hidden="true">
            <span class="strength h-1 flex-1 rounded-full bg-surface-container transition-colors"></span>
            <span class="strength h-1 flex-1 rounded-full bg-surface-container transition-colors"></span>
            <span class="strength h-1 flex-1 rounded-full bg-surface-container transition-colors"></span>
            <span class="strength h-1 flex-1 rounded-full bg-surface-container transition-colors"></span>
          </div>
          <p id="strengthText" class="text-[12.5px] text-slate-subtle mt-1"></p>
        </div>

        <label class="flex items-start gap-2.5 text-[13.5px] text-on-surface-variant cursor-pointer select-none leading-snug">
          <input id="agreeTerms" type="checkbox" class="mt-0.5 w-4 h-4 rounded border-slate-border text-primary-container focus:ring-primary-container/30" />
          <span>I agree to the <a href="terms.html" target="_blank" rel="noopener" class="link">Terms of Service</a> and <a href="privacy.html" target="_blank" rel="noopener" class="link">Privacy Policy</a>.</span>
        </label>

        <button type="submit" id="signupBtn" class="btn-primary">Create account</button>

        <p class="text-center text-[14px] text-slate-muted">
          Already have an account? <button type="button" data-view="login" class="link">Login</button>
        </p>
      </form>

      <!-- FORGOT PASSWORD -->
      <form id="resetForm" class="space-y-4" novalidate hidden>
        <div>
          <h2 class="text-[18px] font-semibold text-on-surface">Reset your password</h2>
          <p class="text-[14px] text-slate-muted mt-1">Enter your email and we will send you a link to set a new password.</p>
        </div>
        <div>
          <label class="label" for="resetEmail">Email</label>
          <div class="relative">
            <span class="material-symbols-outlined field-icon">mail</span>
            <input id="resetEmail" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" class="field" required />
          </div>
        </div>
        <button type="submit" id="resetBtn" class="btn-primary">Send reset link</button>
        <p class="text-center text-[14px]">
          <button type="button" data-view="login" class="link inline-flex items-center gap-1">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to login
          </button>
        </p>
      </form>
    </div>

    <p class="text-center text-[12.5px] text-slate-subtle mt-5">© FreeZone BD</p>
  </div>
</main>

<script type="module" src="./login.js"></script>
</body>
</html>
