<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR News — Admin-কে মেসেজ করুন</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f7; --ink:#151515; --muted:#6b6b6b; --line:#e3e3e3;
    --brand:#0f766e; --brand-ink:#0b3d38; --brand-soft:#eef5f4;
    --danger:#c0392b;
    --font-display:'Tiro Bangla',Georgia,serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;display:flex;flex-direction:column;height:100%;overflow:hidden}
  a{color:inherit}
  button{-webkit-tap-highlight-color:transparent}

  .ar-nav{display:flex;align-items:center;gap:12px;padding:calc(12px + var(--safe-t)) 16px 12px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
  .ar-brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
  .ar-brand img{width:26px;height:26px;border-radius:7px;display:block}
  .ar-nav h1{font-family:var(--font-display);font-size:16px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}

  .btn{display:inline-block;text-align:center;text-decoration:none;border:0;border-radius:10px;padding:11px 16px;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .btn:active{opacity:.85}

  #app{flex:1;min-height:0;display:flex;flex-direction:column}

  .gate{max-width:380px;margin:14vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
  .gate h2{font-family:var(--font-display);margin:0 0 8px;font-size:21px}
  .gate p{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.6}
  .loading-line{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px}

  .unread-note{text-align:center;font-size:12px;color:var(--brand-ink);background:var(--brand-soft);padding:7px;flex-shrink:0;transition:opacity .4s}
  .unread-note[hidden]{display:none}

  .chat-msgs{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
  .empty-chat{color:var(--muted);text-align:center;padding:30px 10px;font-size:13.5px}
  .bubble{max-width:80%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
  .bubble.admin{align-self:flex-start;background:#f1f1f1;color:var(--ink);border-bottom-left-radius:4px}
  .bubble.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .bubble time{display:block;margin-top:4px;font-size:10.5px;opacity:.65}

  .chat-form{display:flex;gap:8px;padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:#fff;flex-shrink:0}
  .chat-form input{flex:1;border:1px solid var(--line);border-radius:20px;padding:11px 16px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .chat-form input:focus{outline:2px solid var(--brand);outline-offset:1px}
  .chat-form button{border-radius:20px}
</style>
</head>
<body>
  <header class="ar-nav">
    <a class="ar-brand" href="feed.html"><img src="logo.png" alt="AR News"></a>
    <h1>Admin-কে মেসেজ করুন</h1>
  </header>

  <main id="app">
    <div class="loading-line">লোড হচ্ছে…</div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  <script>
  (function () {
    "use strict";
    const app = document.getElementById("app");
    let msgsRef = null, msgsHandler = null;

    window.auth.onAuthStateChanged(function (user) {
      cleanup();
      if (!user) { renderGate(); return; }
      renderChat(user);
    });

    function cleanup() {
      if (msgsRef && msgsHandler) msgsRef.off("child_added", msgsHandler);
      msgsRef = null; msgsHandler = null;
    }

    function renderGate() {
      app.innerHTML =
        '<div class="gate">' +
          "<h2>চ্যাট করতে লগইন করুন</h2>" +
          "<p>Admin-এর সাথে সরাসরি কথা বলতে হলে আগে আপনার একাউন্টে লগইন করুন।</p>" +
          '<a class="btn" href="feed.html">ফিড পেজে ফিরে যান</a>' +
        "</div>";
    }

    function renderChat(user) {
      const uid = user.uid;
      app.innerHTML =
        '<div id="unread-note" class="unread-note" hidden></div>' +
        '<div id="chat-msgs" class="chat-msgs"><div class="loading-line">মেসেজ লোড হচ্ছে…</div></div>' +
        '<form id="chat-form" class="chat-form">' +
          '<input id="chat-input" type="text" placeholder="একটি মেসেজ লিখুন…" autocomplete="off">' +
          '<button type="submit" class="btn">পাঠান</button>' +
        "</form>";

      const box = document.getElementById("chat-msgs");
      const note = document.getElementById("unread-note");
      const metaRef = window.rtdb.ref("chats/" + uid + "/meta");

      // পেজ ওপেন করা মানেই মেসেজ দেখা হয়ে গেছে ধরে unreadByUser রিসেট করা হচ্ছে,
      // কিন্তু আগে কত নতুন মেসেজ ছিল সেটা একবার দেখিয়ে দেওয়া হচ্ছে।
      metaRef.once("value").then(function (snap) {
        const meta = snap.val() || {};
        const unread = Number(meta.unreadByUser || 0);
        if (unread > 0) {
          note.hidden = false;
          note.textContent = new Intl.NumberFormat("bn-BD").format(unread) + " টি নতুন মেসেজ";
          setTimeout(function () { note.hidden = true; }, 2500);
        }
        metaRef.update({
          unreadByUser: 0,
          userName: user.displayName || user.email || "",
          userEmail: user.email || "",
        });
      });

      box.innerHTML = "";
      let hasAny = false;
      msgsRef = window.rtdb.ref("chats/" + uid + "/messages").orderByKey();
      msgsHandler = msgsRef.on("child_added", function (snap) {
        hasAny = true;
        appendBubble(box, snap.val() || {});
        box.scrollTop = box.scrollHeight;
      });
      msgsRef.once("value").then(function (snap) {
        if (!snap.exists() && !hasAny) {
          box.innerHTML = '<div class="empty-chat">এখনো কোনো মেসেজ নেই। Admin-কে প্রথম মেসেজ পাঠান!</div>';
        }
      });

      document.getElementById("chat-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (!text) return;
        window.rtdb.ref("chats/" + uid + "/messages").push({
          sender: "user",
          text: text,
          at: firebase.database.ServerValue.TIMESTAMP,
        });
        window.rtdb.ref("chats/" + uid + "/meta").update({
          lastMessage: text,
          lastMessageAt: firebase.database.ServerValue.TIMESTAMP,
          lastSender: "user",
          userName: user.displayName || user.email || "",
          userEmail: user.email || "",
        });
        window.rtdb.ref("chats/" + uid + "/meta/unreadByAdmin").transaction(function (v) { return (v || 0) + 1; });
        input.value = "";
        input.focus();
      });
    }

    function appendBubble(container, data) {
      const empty = container.querySelector(".empty-chat");
      if (empty) empty.remove();
      const div = document.createElement("div");
      div.className = "bubble " + (data.sender === "user" ? "me" : "admin");
      const p = document.createElement("div");
      p.textContent = data.text || "";
      const t = document.createElement("time");
      t.textContent = fmtTime(data.at);
      div.appendChild(p);
      div.appendChild(t);
      container.appendChild(div);
    }

    function fmtTime(ts) {
      if (!ts) return "";
      try {
        return new Intl.DateTimeFormat("bn-BD", { hour: "2-digit", minute: "2-digit" }).format(new Date(ts));
      } catch (_) { return ""; }
    }
  })();
  </script>
</body>
</html>
