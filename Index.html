<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeZone BD — Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fa;color:#172033;font-family:system-ui,-apple-system,sans-serif}
.card{width:min(430px,92%);background:#fff;padding:28px;border-radius:24px;box-shadow:0 15px 50px #0001}
.logo{text-align:center;font-size:31px;font-weight:900}
.sub{text-align:center;color:#748095;margin:5px 0 24px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;border:0;padding:11px;border-radius:11px;background:#edf1f6;cursor:pointer}
.tabs .active{background:#172033;color:#fff}
form{display:grid;gap:11px}
input{width:100%;padding:13px;border:1px solid #d9e0e9;border-radius:11px;font:inherit}
.primary{padding:13px;border:0;border-radius:11px;background:#172033;color:#fff;font:inherit;cursor:pointer}
.message{padding:10px;border-radius:10px;margin-bottom:10px;font-size:14px}
.message.error{background:#fee2e2;color:#991b1b}
.message.success{background:#dcfce7;color:#166534}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="logo">FreeZone BD</div>
  <div class="sub">Connect. Share. Chat.</div>

  <div class="tabs">
    <button id="loginTab" class="active">Login</button>
    <button id="registerTab">Create Account</button>
  </div>

  <div id="authMessage" class="message" hidden></div>

  <form id="loginForm">
    <input id="loginEmail" type="email" placeholder="Email" required>
    <input id="loginPassword" type="password" placeholder="Password" required>
    <button class="primary">Login</button>
  </form>

  <form id="registerForm" class="hidden">
    <input id="regName" placeholder="Full name" required>
    <input id="regUsername" placeholder="Username" required>
    <input id="regEmail" type="email" placeholder="Email" required>
    <input id="regPassword" type="password" placeholder="Password — minimum 6" required>
    <button class="primary">Create Account</button>
  </form>
</main>

<script type="module">
import { login, register } from "./Login.js";

const $ = s => document.querySelector(s);

$("#loginTab").onclick = () => {
  $("#loginForm").classList.remove("hidden");
  $("#registerForm").classList.add("hidden");
  $("#loginTab").classList.add("active");
  $("#registerTab").classList.remove("active");
};

$("#registerTab").onclick = () => {
  $("#registerForm").classList.remove("hidden");
  $("#loginForm").classList.add("hidden");
  $("#registerTab").classList.add("active");
  $("#loginTab").classList.remove("active");
};

$("#loginForm").onsubmit = e => {
  e.preventDefault();
  login();
};

$("#registerForm").onsubmit = e => {
  e.preventDefault();
  register();
};
</script>
</body>
</html>
